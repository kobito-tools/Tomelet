<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#6CC1B4"/>
      <stop offset="1" stop-color="#2F8184"/>
    </linearGradient>
    <linearGradient id="cover" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#D9604F"/>
      <stop offset="1" stop-color="#A83A35"/>
    </linearGradient>
    <linearGradient id="pages" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FFF6E2"/>
      <stop offset="1" stop-color="#EADBB8"/>
    </linearGradient>
    <linearGradient id="brass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F6D27A"/>
      <stop offset="1" stop-color="#C98F2E"/>
    </linearGradient>
    <radialGradient id="dial" cx="0.42" cy="0.36" r="0.75">
      <stop offset="0" stop-color="#FFFDF6"/>
      <stop offset="1" stop-color="#F1E4C6"/>
    </radialGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="20" flood-color="#0E3B3D" flood-opacity="0.35"/>
    </filter>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="7" flood-color="#5A1C19" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- 背景 -->
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#bg)"/>

  <!-- 本 -->
  <g filter="url(#shadow)">
    <!-- 小口（ページ） -->
    <path d="M296 250h392a36 36 0 0 1 36 36v468a36 36 0 0 1-36 36H296z" fill="url(#pages)"/>
    <g stroke="#D8C49A" stroke-width="5" stroke-linecap="round" opacity="0.8">
      <path d="M702 300v436"/>
      <path d="M714 312v412"/>
    </g>
    <!-- 表紙 -->
    <rect x="276" y="226" width="424" height="548" rx="34" fill="url(#cover)"/>
    <!-- 背表紙 -->
    <path d="M310 226h-0a34 34 0 0 0-34 34v480a34 34 0 0 0 34 34h26V226z" fill="#8E2F2C"/>
    <rect x="336" y="226" width="8" height="548" fill="#FFFFFF" opacity="0.12"/>
    <!-- 表紙の飾り枠 -->
    <rect x="374" y="262" width="292" height="476" rx="18" fill="none" stroke="#F6D27A" stroke-width="6" opacity="0.55"/>
  </g>

  <!-- しおり紐 -->
  <path d="M600 770v96l26-22 26 22v-96z" fill="#F2B63C"/>
  <path d="M600 770h52v14h-52z" fill="#C98F2E" opacity="0.6"/>

  <!-- 文字盤 -->
  <g filter="url(#soft)">
    <circle cx="520" cy="500" r="138" fill="url(#brass)"/>
    <circle cx="520" cy="500" r="116" fill="url(#dial)"/>
  </g>
  <g fill="#7A4A2A">
    <rect x="514" y="398" width="12" height="26" rx="6"/>
    <rect x="514" y="576" width="12" height="26" rx="6"/>
    <rect x="418" y="494" width="26" height="12" rx="6"/>
    <rect x="596" y="494" width="26" height="12" rx="6"/>
  </g>
  <g fill="#7A4A2A" opacity="0.45">
    <circle cx="571" cy="412" r="5"/><circle cx="608" cy="449" r="5"/>
    <circle cx="608" cy="551" r="5"/><circle cx="571" cy="588" r="5"/>
    <circle cx="469" cy="588" r="5"/><circle cx="432" cy="551" r="5"/>
    <circle cx="432" cy="449" r="5"/><circle cx="469" cy="412" r="5"/>
  </g>
  <!-- 針（10時10分） -->
  <g stroke-linecap="round">
    <path d="M520 500L460 466" stroke="#4A2A1A" stroke-width="16"/>
    <path d="M520 500L590 440" stroke="#4A2A1A" stroke-width="11"/>
  </g>
  <circle cx="520" cy="500" r="15" fill="#C98F2E"/>
  <circle cx="520" cy="500" r="6" fill="#FFF6E2"/>

  <!-- チクタクの揺れ -->
  <g fill="none" stroke="#FFF6E2" stroke-width="12" stroke-linecap="round" opacity="0.9">
    <path d="M702 344a120 120 0 0 1 44 64"/>
    <path d="M734 300a176 176 0 0 1 60 96"/>
  </g>
</svg>
